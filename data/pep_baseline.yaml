charter_refinements:
  - key: m4
    element: M-4 stacking date
    a1: "Objective 1: pad integration 15 Oct. Milestone M-4: stacking 28 Oct."
    why: "Removes the internal collision. Creates a 15-day pad-test buffer before the 30 Oct hot-fire gate."
  - key: m8
    element: M-8 handover date
    a1: "``5 days post-launch'' and milestone date 22 Nov (7 days after 15 Nov)."
    why: "Aligns the milestone with Objective 5 and the 5-day rule."
  - key: cost
    element: Cost baseline
    a1: "``Manage within the allocated operational budget.'' No figure."
    why: "Crane hire, cryogenic crews, and LOX delivery cannot be controlled without a numbered baseline."
  - key: permits
    element: Permit vs stacking logic
    a1: "M-3 flight permits 25 Oct were predecessors of M-4 stacking (then 28 Oct)."
    why: "Stacking is a site-licence activity. Hot fire is a range activity. This also creates a second critical path."
  - key: juru
    element: Juru engagement
    a1: "High power / high interest, Manage Closely, consultation and monitoring."
    why: "A1 strategy was correct in class; the PEP makes it an enforceable pad control, not a comms plan."
  - key: testing
    element: Testing sequence
    a1: "WDR and 5-second static fire as one Objective 3 output by 30 Oct."
    why: "Hot fire must wait for flight permits. LRR cannot start on incomplete post-fire data."
  - key: risk
    element: Risk governance
    a1: "Five high-level threats, no $P \\times I$ money."
    why: "Generic rows cannot size contingency or point at a WBS line."
  - key: resource
    element: Resource peak
    a1: "Roles listed; no demand vs capacity."
    why: "A1 could not show where the plan exceeds capacity."
  - key: stakeholders
    element: Regulator and payload
    a1: "ASA High/Low Keep Satisfied, file 60 days prior. Payload sponsor Med/High Keep Informed, witness LRR."
    a3: "ASA remains Keep Satisfied. CASA issues the airspace NOTAM (R-14). Payload sponsor still witnesses LRR on A-141 (HP-4). No 10--12~Nov geometry is used."
    why: "A1 named ASA, not Townsville, as the high-power regulator. The PEP keeps that filing rule and uses CASA as the airspace instrument."
  - key: success
    element: Success criteria
    a1: "Q1 2027 window; no funds beyond contingency; 98.5\\% telemetry in 5 days; zero LTI/GBRMPA/Juru; defects to R\\&D."
    a3: "T-0 15~Nov inside A1's Q1 2027 window (2-day in-flight trigger); $AC \\le BAC$; 98.5\\% telemetry in 5 days; LRR first submission; four-engine 5~s fire; zero LTI/GBRMPA/Juru; defects to R\\&D. LEO is Gilmour's test, not the consultancy's."
    why: "A1 tests stay. The PEP numbers cost and tightens in-flight control inside Q1 2027. LEO is not this team's finish line."
  - key: objectives
    element: Objectives 4 and 5
    a1: "Objective 4: pass LRR by 10 Nov. Objective 5: November 2026 window and 98.5\\% telemetry."
    a3: "Objective 4 is $T$-0 on 15~Nov (M-7) inside Q1 2027, with a 2-day in-flight trigger. Objective 5 is 98.5\\% handover on 20~Nov (M-8) and closeout on 1~Dec. LRR remains M-6 / first-submission success, not a numbered objective."
    why: "The numbered objectives now match the gates this consultancy controls. LRR is still HP-4; it is no longer counted twice as both Obj~4 and M-6."
  - key: lrr
    element: LRR attendees
    a1: "M-6: Launch Director, Range Safety Officer and Juru Land Liaisons review. Payload sponsor witnesses LRR."
    a3: "HP-4 release is Launch Director, RSO, Juru Officer, Abdul and Ziyad. Payload sponsor remains a witness, not a signatory."
    why: "A1 named the review board. The PEP keeps those three on the hold and does not promote the payload sponsor from witness to signatory."
  - key: week8
    element: Week 8 charter review
    a1: "Team will review this charter in the Week 8 workshop and revise roles if necessary."
    a3: "Week 8 workshop reopened the charter. No roles, DoA or contribution split were renegotiated."
    why: "The brief asked teams to record renegotiations. There were none; omitting the row would look as if the review was skipped."

executive:
  top_risks: [R-01, R-12, R-14]
  risks:
    R-01: "R-01 is a residual pump-insulation defect: static-fire auto-abort on A-133 and a 12--14~day critical-path recycle."
    R-12: "R-12 is the TestFlight~1 in-flight mode: thrust loss in two first-stage hybrid motors after $T$-0, as at T+14~s, ending the heritage objective."
